name: PowerShell checks
on:
  push:
  pull_request:
permissions:
  contents: read
concurrency:
  group: checks-${{ github.ref }}
  cancel-in-progress: true
jobs:
  test:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      # Pinned to a commit SHA, not a floating tag, so the tag cannot be
      # repointed at different code by anyone but this repository's maintainers.
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5.0.0
        with:
          persist-credentials: false
      - name: Syntax and non-destructive regression tests
        shell: powershell
        run: .\tests\Test-RemoveEdge.ps1 -SkipMachineChecks